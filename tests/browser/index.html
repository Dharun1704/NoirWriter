<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NoirWrite tests</title>
  <script src="/tests/test-mode.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0d0c0a; color: #f2ede3; font: 13px/1.5 system-ui, sans-serif; }
    header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid #322d25; }
    h1 { margin: 0; font-size: 18px; color: #f5a623; }
    #summary { color: #a59b8a; }
    main { display: grid; grid-template-columns: 420px 1fr; gap: 16px; padding: 16px 20px; }
    #list { margin: 0; padding: 0; list-style: none; max-height: calc(100vh - 90px); overflow: auto; }
    #list li { padding: 4px 8px; border-radius: 6px; display: flex; gap: 8px; }
    #list li.run { background: #24211c; }
    #list .mark { width: 38px; flex: none; font-weight: 600; }
    #list .ok .mark { color: #7fa36b; }
    #list .fail .mark { color: #c4544a; }
    #list .why { display: block; color: #c4544a; font-size: 12px; }
    .stage { width: 770px; height: 495px; overflow: hidden; border: 1px solid #322d25; border-radius: 8px; }
    /* the app runs at a fixed 1400 x 900 (so results don't depend on your window), shown smaller */
    #app { width: 1400px; height: 900px; border: 0; transform: scale(.55); transform-origin: 0 0; background: #fff; }
  </style>
</head>
<body>
  <header><h1>NoirWrite tests</h1><span id="summary">Starting…</span></header>
  <main>
    <ol id="list"></ol>
    <div class="stage"><iframe id="app" title="NoirWrite under test"></iframe></div>
  </main>
  <script type="module" src="/tests/runner.js"></script>
</body>
</html>
